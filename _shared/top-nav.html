<script>
(function(){
  var menu    = document.getElementById('mobile-menu');
  var drawer  = document.getElementById('mobile-menu-drawer');
  var openBtn = document.getElementById('nav-menu-btn');
  var closeBtn= document.getElementById('nav-menu-close');
  var backdrop= document.getElementById('mobile-menu-backdrop');
  var menuSearchBtn = document.getElementById('mobile-menu-search');

  function openMenu(){
    menu.style.display = 'block';
    menu.setAttribute('aria-hidden','false');
    document.body.style.overflow = 'hidden';
    requestAnimationFrame(function(){
      drawer.style.transform = 'translateX(0)';
    });
    closeBtn.focus();
  }
  function closeMenu(){
    drawer.style.transform = 'translateX(100%)';
    document.body.style.overflow = '';
    setTimeout(function(){ menu.style.display = 'none'; menu.setAttribute('aria-hidden','true'); }, 260);
    openBtn.focus();
  }

  if(openBtn)  openBtn.addEventListener('click', openMenu);
  if(closeBtn) closeBtn.addEventListener('click', closeMenu);
  if(backdrop) backdrop.addEventListener('click', closeMenu);
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && menu.style.display==='block') closeMenu(); });

  // Wire search button in menu to open search overlay
  if(menuSearchBtn) menuSearchBtn.addEventListener('click', function(){
    closeMenu();
    setTimeout(function(){ if(window.openSiteSearch) window.openSiteSearch(); }, 280);
  });
})();
</script>

<script>
(function(){
  var header = document.querySelector('header');
  if (!header) return;
  var lastY = window.scrollY;
  var menuOpen = false;
  var openBtn = document.getElementById('nav-menu-btn');
  var closeBtn = document.getElementById('nav-menu-close');
  var backdrop = document.getElementById('mobile-menu-backdrop');
  if (openBtn)  openBtn.addEventListener('click',  function(){ menuOpen = true; });
  if (closeBtn) closeBtn.addEventListener('click', function(){ menuOpen = false; });
  if (backdrop) backdrop.addEventListener('click', function(){ menuOpen = false; });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') menuOpen = false; });
  window.addEventListener('scroll', function(){
    var y = window.scrollY;
    header.classList.toggle('header-scrolled', y > 8);
    if (!menuOpen) {
      if (y > lastY && y > 80) {
        header.classList.add('header-hidden');
      } else {
        header.classList.remove('header-hidden');
      }
    }
    lastY = y;
  }, { passive: true });
})();
</script>
