<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>QA — JFSN Archive</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="_shared/ui.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
    :root {
      --bg:      #fcf9f3;
      --surface: #ebe8e2;
      --border:  #0B0B0B;
      --text:    #0B0B0B;
      --muted:   #575757;
      --accent:  #ff6600;
      --warn:    #c07a00;
      --err:     #cc2200;
      --ok-color:#2a7a2a;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      line-height: 1.4;
    }

    /* ── Header ── */
    .bar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 0.625rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .bar__title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .bar__title span {
      color: var(--accent);
    }

    /* ── Filter chips ── */
    .chips {
      display: flex;
      gap: 0.3rem;
      flex-wrap: wrap;
      flex: 1;
    }
    .chip {
      appearance: none;
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font: inherit;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.2rem 0.55rem;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.1s, border-color 0.1s;
    }
    .chip:hover { color: var(--text); border-color: #575757; }
    .chip.active { color: var(--accent); border-color: var(--accent); }
    .chip .n { opacity: 0.45; margin-left: 0.3em; font-size: 0.9em; }
    .chip.active .n { opacity: 0.7; }

    .bar__stats {
      margin-left: auto;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── Drift table (keyword count report) ── */
    .drift-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.625rem 1.5rem;
      display: none;
      flex-wrap: wrap;
      gap: 0.375rem 1.5rem;
    }
    .drift-bar.visible { display: flex; }
    .drift-item {
      font-size: 10px;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .drift-item.hot { color: var(--err); font-weight: 700; }

    /* ── Grid ── */
    .grid-wrap {
      padding: 1rem 1.5rem 5rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.5rem;
    }
    @media (max-width: 1400px) { .grid { grid-template-columns: repeat(5, 1fr); } }
    @media (max-width: 1100px) { .grid { grid-template-columns: repeat(4, 1fr); } }
    @media (max-width:  800px) { .grid { grid-template-columns: repeat(3, 1fr); } }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      overflow: hidden;
      position: relative;
      transition: border-color 0.12s;
    }
    .card:hover { border-color: #444; }
    .card a {
      display: block;
      text-decoration: none;
      color: inherit;
    }
    .card__img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      object-position: center top;
      background: #111;
      display: block;
    }
    .card__body {
      padding: 0.35rem 0.45rem 0.45rem;
    }
    .card__id {
      font-size: 9px;
      letter-spacing: 0.12em;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .card__title {
      font-size: 10px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }
    .card__flags {
      display: flex;
      gap: 2px;
      margin-top: 4px;
      flex-wrap: wrap;
    }
    .flag {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 1px 4px;
    }
    .flag--warn { background: rgba(232,200,48,0.14); color: var(--warn); }
    .flag--err  { background: rgba(232,92,16,0.14);  color: var(--err);  }
    .flag--ok   { background: rgba(58,120,56,0.14);  color: var(--ok-color); }

    /* ── Empty state ── */
    .empty {
      grid-column: 1 / -1;
      padding: 4rem 0;
      text-align: center;
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }
  </style>
  <!-- Phase 1 Enhancement Stylesheets -->
  <link rel="stylesheet" href="/_shared/lightbox.css"/>
  <link rel="stylesheet" href="/_shared/enhancements.css"/>
  <!-- Phase 2 Enhancement Stylesheets -->
  <link rel="stylesheet" href="/_shared/toast.css"/>
  <link rel="stylesheet" href="/_shared/skeleton.css"/>
  <link rel="stylesheet" href="/_shared/hover-preview.css"/>
  <!-- Phase 3 Enhancement Stylesheets -->
  <link rel="stylesheet" href="/_shared/scroll-reveal.css"/>
  <link rel="stylesheet" href="/_shared/form-validation.css"/>
  <link rel="stylesheet" href="/_shared/page-transitions.css"/>
  <link rel="stylesheet" href="/_shared/lazy-load.css"/>
</head>
<body>

<div class="bar">
  <div class="bar__title">QA — <span>JFSN</span> Archive</div>
  <div class="chips" id="chips"></div>
  <div class="bar__stats" id="stats"></div>
</div>

<div class="drift-bar" id="drift-bar"></div>

<div class="grid-wrap">
  <div class="grid" id="grid">
    <p class="empty">Loading catalog…</p>
  </div>
</div>

<script>
(function () {
  'use strict';

  const FULL_MEDIA = new Set(['collage', 'sculpture', 'painting']);

  let catalog = [];
  let active  = 'all';

  /* ── QA filter definitions ── */
  const FILTERS = [
    {
      id: 'all',
      label: 'All',
    },
    {
      id: 'no-year',
      label: 'No year',
      test: r => r.year === null || r.year === undefined,
    },
    {
      id: 'no-motifs',
      label: 'Empty motifs',
      test: r => FULL_MEDIA.has(r.work_type) && !(r.motifs && r.motifs.length),
    },
    {
      id: 'no-materials',
      label: 'Empty materials',
      test: r => FULL_MEDIA.has(r.work_type) && !(r.materials && r.materials.length),
    },
    {
      id: 'no-themes',
      label: 'No themes',
      test: r => !(r.themes && r.themes.length),
    },
    {
      id: 'short-desc',
      label: 'Short description',
      test: r => {
        if (!r.description) return true;
        return r.description.trim().split(/\s+/).length < 15;
      },
    },
    {
      id: 'uncataloged',
      label: 'Uncataloged',
      test: r => !r.title,
    },
    {
      id: 'keyword-drift',
      label: 'Keyword drift',
      test: r => {
        /* show works whose keywords appear in the high-drift list */
        const hot = getHotKeywords();
        return (r.keywords || []).some(k => hot.has(k));
      },
    },
    {
      id: 'flagged',
      label: 'Any issue',
      test: r => getFlags(r).some(f => f.cls !== 'ok'),
    },
  ];

  /* ── Keyword frequency analysis ── */
  let _hotKeywords = null;
  function getHotKeywords() {
    if (_hotKeywords) return _hotKeywords;
    const counts = {};
    catalog.forEach(r => {
      (r.keywords || []).forEach(k => { counts[k] = (counts[k] || 0) + 1; });
    });
    _hotKeywords = new Set(Object.entries(counts).filter(([, v]) => v > 10).map(([k]) => k));
    return _hotKeywords;
  }

  function getKeywordCounts() {
    const counts = {};
    catalog.forEach(r => {
      (r.keywords || []).forEach(k => { counts[k] = (counts[k] || 0) + 1; });
    });
    return counts;
  }

  /* ── Per-record flag computation ── */
  function getFlags(r) {
    const out = [];
    if (!r.title)                                                              out.push({ label: 'uncataloged', cls: 'err'  });
    if (r.year === null || r.year === undefined)                               out.push({ label: 'no year',     cls: 'warn' });
    if (FULL_MEDIA.has(r.work_type) && !(r.motifs    && r.motifs.length))     out.push({ label: 'no motifs',   cls: 'warn' });
    if (FULL_MEDIA.has(r.work_type) && !(r.materials && r.materials.length))  out.push({ label: 'no mats',     cls: 'warn' });
    if (!(r.themes && r.themes.length))                                        out.push({ label: 'no themes',   cls: 'warn' });
    if (!r.description)                                                        out.push({ label: 'no desc',     cls: 'err'  });
    else if (r.description.trim().split(/\s+/).length < 15)                   out.push({ label: 'short desc',  cls: 'err'  });
    const hot = getHotKeywords();
    if ((r.keywords || []).some(k => hot.has(k)))                             out.push({ label: 'kw drift',    cls: 'err'  });
    if (out.length === 0 && r.title)                                           out.push({ label: 'ok',          cls: 'ok'   });
    return out;
  }

  /* ── Build chip bar ── */
  function buildChips(counts) {
    const bar = document.getElementById('chips');
    bar.innerHTML = '';
    FILTERS.forEach(f => {
      const n = f.id === 'all' ? catalog.length : (counts[f.id] || 0);
      const btn = document.createElement('button');
      btn.className = 'chip' + (f.id === active ? ' active' : '');
      btn.innerHTML = f.label + '<span class="n">' + n + '</span>';
      btn.addEventListener('click', () => {
        active = f.id;
        render();
      });
      bar.appendChild(btn);
    });
  }

  function updateChips() {
    document.querySelectorAll('.chip').forEach((btn, i) => {
      btn.className = 'chip' + (FILTERS[i].id === active ? ' active' : '');
    });
  }

  /* ── Drift bar (always shown when data loaded) ── */
  function buildDriftBar() {
    const counts = getKeywordCounts();
    const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 20);
    const bar = document.getElementById('drift-bar');
    if (!sorted.length) return;
    bar.innerHTML = '<span style="font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);flex-shrink:0">Top keywords:</span>';
    sorted.forEach(([kw, n]) => {
      const div = document.createElement('div');
      div.className = 'drift-item' + (n > 10 ? ' hot' : '');
      div.textContent = kw + ' ×' + n + (n > 10 ? ' ⚠' : '');
      div.title = n > 10 ? 'Drift risk — this keyword appears in >' + n + ' works. Consider a more specific term.' : '';
      bar.appendChild(div);
    });
    bar.classList.add('visible');
  }

  /* ── Render grid ── */
  function render() {
    const filterDef = FILTERS.find(f => f.id === active);
    const visible   = active === 'all' ? catalog : catalog.filter(filterDef.test);

    document.getElementById('stats').textContent =
      visible.length.toLocaleString() + ' / ' + catalog.length.toLocaleString() + ' works';

    updateChips();

    const grid = document.getElementById('grid');
    if (!visible.length) {
      grid.innerHTML = '<p class="empty">No issues found for this filter</p>';
      return;
    }

    const frag = document.createDocumentFragment();
    visible.forEach(r => {
      const id    = (r.file || '').replace('.avif', '');
      const flags = getFlags(r);
      const card  = document.createElement('div');
      card.className = 'card';

      const flagHTML = flags
        .map(f => `<span class="flag flag--${f.cls}">${f.label}</span>`)
        .join('');

      const wt = r.work_type ? r.work_type.replace('_', ' ') : '';
      const yr = r.year ? String(r.year) : '';
      const meta = [yr, wt].filter(Boolean).join(' · ');

      card.innerHTML =
        '<a href="artwork.html?id=' + id + '" target="_blank">' +
          '<img class="card__img" src="artworks/thumbs/' + id + '.avif" alt="" loading="lazy">' +
          '<div class="card__body">' +
            '<div class="card__id">' + id + (meta ? ' &nbsp;· ' + meta : '') + '</div>' +
            '<div class="card__title">' + esc(r.title || '—') + '</div>' +
            '<div class="card__flags">' + flagHTML + '</div>' +
          '</div>' +
        '</a>';
      frag.appendChild(card);
    });
    grid.replaceChildren(frag);
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* ── Boot ── */
  fetch('catalog.json')
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(data => {
      catalog = data;

      /* Precompute filter counts */
      const counts = {};
      FILTERS.forEach(f => {
        if (f.test) counts[f.id] = data.filter(f.test).length;
      });

      buildChips(counts);
      buildDriftBar();
      render();
    })
    .catch(() => {
      document.getElementById('grid').innerHTML =
        '<p class="empty">Could not load catalog.json — run build_catalog.py first.</p>';
    });
})();
</script>
<script src="_shared/ui.js" defer></script>
<script src="_shared/nav-active.js" defer></script>
  <!-- Phase 1 Enhancement Scripts -->
  <script src="/_shared/lightbox.js" defer></script>
  <script src="/_shared/scroll-to-top.js" defer></script>
  <!-- Phase 2 Enhancement Scripts -->
  <script src="/_shared/toast.js" defer></script>
  <script src="/_shared/hover-preview.js" defer></script>
  <!-- Phase 3 Enhancement Scripts -->
  <script src="/_shared/scroll-reveal.js" defer></script>
  <script src="/_shared/form-validation.js" defer></script>
  <script src="/_shared/page-transitions.js" defer></script>
  <script src="/_shared/lazy-load.js" defer></script>
</body>
</html>
