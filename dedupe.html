<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dedupe Titles — JFSN</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #0b0b0b;
      --text:   #f3f0ea;
      --muted:  rgba(243,240,234,0.5);
      --dim:    rgba(243,240,234,0.1);
      --accent: #FF6600;
      --green:  #4caf50;
      --font:   system-ui, -apple-system, sans-serif;
      --serif:  'Georgia', serif;
    }

    body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.5; }

    /* ── Topbar ── */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      background: var(--bg); border-bottom: 1px solid var(--dim);
      display: flex; align-items: center; gap: 1rem;
      padding: 0.75rem 1.5rem; flex-wrap: wrap;
    }
    .topbar h1 { font-size: 0.875rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; flex-shrink: 0; }
    .topbar-stats { font-size: 0.8125rem; color: var(--muted); flex: 1; }

    .btn {
      appearance: none; border: 1px solid var(--dim); background: transparent;
      color: var(--text); font-size: 0.75rem; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      padding: 0.5rem 1.25rem; cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .btn:hover:not(:disabled) { border-color: var(--muted); background: rgba(243,240,234,0.06); }
    .btn:disabled { opacity: 0.35; cursor: default; }
    .btn-save {
      background: var(--accent); color: #0b0b0b;
      border-color: var(--accent); font-weight: 700;
    }
    .btn-save:hover:not(:disabled) { opacity: 0.88; background: var(--accent); color: #0b0b0b; }

    .toggle-row { display: flex; gap: 0.5rem; align-items: center; }
    .toggle-label { font-size: 0.75rem; color: var(--muted); }
    .toggle-btn {
      appearance: none; border: 1px solid var(--dim); background: transparent;
      color: var(--muted); font-size: 0.6875rem; letter-spacing: 0.06em;
      padding: 0.3rem 0.75rem; cursor: pointer; transition: all 0.12s;
    }
    .toggle-btn.active { border-color: var(--accent); color: var(--accent); }

    /* ── Status bar ── */
    .status-bar {
      padding: 0.5rem 1.5rem;
      font-size: 0.8125rem;
      border-bottom: 1px solid var(--dim);
      min-height: 2rem;
    }
    .status-bar:empty { display: none; }
    .status-saving { color: var(--muted); animation: pulse 1.2s ease-in-out infinite; }
    .status-ok   { color: var(--green); }
    .status-err  { color: #e85a0a; }
    @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }

    /* ── Main list ── */
    .main { padding: 1.5rem; }

    .group {
      border-bottom: 1px solid var(--dim);
      padding: 1.25rem 0;
    }
    .group:last-child { border-bottom: none; }

    .group-header {
      display: flex; align-items: baseline; gap: 0.75rem; margin-bottom: 1rem;
    }
    .group-title {
      font-family: var(--serif); font-size: 1.0625rem; font-weight: normal;
    }
    .group-count {
      font-size: 0.6875rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--accent); background: rgba(232,96,10,0.12);
      padding: 0.15rem 0.5rem; border-radius: 2px;
    }

    .thumbs {
      display: flex; flex-wrap: wrap; gap: 0.75rem;
    }

    .work-card {
      width: 140px; flex-shrink: 0;
      transition: opacity 0.2s;
    }
    .work-card.renamed { opacity: 0.5; }

    .thumb-img {
      display: block; width: 140px; height: 140px;
      object-fit: cover; object-position: center top;
      background: rgba(243,240,234,0.04);
    }
    .work-id {
      font-size: 0.625rem; letter-spacing: 0.08em;
      color: var(--muted); margin-top: 0.3rem; text-align: center;
    }
    .work-title {
      width: 100%; margin-top: 0.25rem;
      font-size: 0.75rem; line-height: 1.35;
      background: transparent; border: none;
      border-bottom: 1px solid transparent;
      color: var(--text); font-family: var(--font);
      padding: 0.2rem 0; cursor: text;
      transition: border-color 0.15s;
      resize: none; overflow: hidden;
      field-sizing: content;
    }
    .work-title:hover   { border-color: var(--dim); }
    .work-title:focus   { outline: none; border-color: var(--accent); }
    .work-title.changed { border-color: var(--accent); color: var(--accent); }

    /* ── Number button ── */
    .btn-num {
      appearance: none; border: 1px solid var(--dim); background: transparent;
      color: var(--muted); font-size: 0.625rem; letter-spacing: 0.08em;
      padding: 0.2rem 0.6rem; cursor: pointer; margin-left: 0.5rem;
      transition: border-color 0.12s, color 0.12s;
    }
    .btn-num:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Empty state ── */
    .empty { padding: 4rem; text-align: center; color: var(--muted); font-size: 0.9375rem; }
  </style>
</head>
<body>

<div class="topbar">
  <h1>Dedupe Titles</h1>
  <span class="topbar-stats" id="stats">Loading…</span>
  <div class="toggle-row">
    <span class="toggle-label">Show:</span>
    <button class="toggle-btn active" id="btn-dupes" onclick="setMode('dupes')">Duplicates only</button>
    <button class="toggle-btn"        id="btn-all"   onclick="setMode('all')">All works</button>
  </div>
  <button class="btn" id="number-all-btn" disabled onclick="autoNumberAll()">Number all</button>
  <button class="btn btn-save" id="save-btn" disabled onclick="saveChanges()">Save &amp; Rebuild</button>
  <a href="curate.html" class="btn">← Curate</a>
</div>

<div class="status-bar" id="status-bar"></div>

<div class="main" id="main">
  <div class="empty">Loading catalog…</div>
</div>

<script>
(function() {
  let catalog  = [];
  let changes  = {};   // { artId: newTitle }
  let mode     = 'dupes';

  // ── Load catalog ────────────────────────────────────────────
  fetch('catalog-lite.json')
    .then(r => r.json())
    .then(data => {
      catalog = data;
      render();
    })
    .catch(() => setStatus('Failed to load catalog-lite.json', 'err'));

  // ── Render ───────────────────────────────────────────────────
  function render() {
    const main = document.getElementById('main');
    main.innerHTML = '';

    // Group by current title (use pending change if any)
    const byTitle = {};
    catalog.forEach(w => {
      const id    = w.file.replace('.avif', '');
      const title = changes[id] ?? w.title ?? 'Untitled';
      if (!byTitle[title]) byTitle[title] = [];
      byTitle[title].push({ ...w, _id: id });
    });

    // Sort: most duplicates first
    const groups = Object.entries(byTitle)
      .sort((a, b) => b[1].length - a[1].length);

    const dupGroups   = groups.filter(([, ws]) => ws.length > 1);
    const totalDupes  = dupGroups.reduce((n, [, ws]) => n + ws.length, 0);
    const pendingCount = Object.keys(changes).length;

    document.getElementById('stats').textContent =
      `${dupGroups.length} duplicate titles · ${totalDupes} works affected` +
      (pendingCount ? ` · ${pendingCount} unsaved change${pendingCount > 1 ? 's' : ''}` : '');
    document.getElementById('save-btn').disabled = pendingCount === 0;
    document.getElementById('number-all-btn').disabled = dupGroups.length === 0;

    const visible = mode === 'dupes' ? dupGroups : groups;

    if (!visible.length) {
      main.innerHTML = '<div class="empty">No duplicates found — all titles are unique ✓</div>';
      return;
    }

    visible.forEach(([title, works]) => {
      const group = document.createElement('div');
      group.className = 'group';

      const header = document.createElement('div');
      header.className = 'group-header';
      header.innerHTML = `
        <span class="group-title">${esc(title)}</span>
        ${works.length > 1 ? `<span class="group-count">${works.length}×</span>` : ''}
        ${works.length > 1 ? `<button class="btn btn-num" onclick="autoNumberGroup(this)">1, 2, 3…</button>` : ''}`;
      group.appendChild(header);

      const row = document.createElement('div');
      row.className = 'thumbs';

      works.forEach(w => {
        const card = document.createElement('div');
        card.className = 'work-card' + (changes[w._id] ? ' renamed' : '');
        card.dataset.id = w._id;

        const currentTitle = changes[w._id] ?? w.title ?? 'Untitled';

        card.innerHTML = `
          <img class="thumb-img"
               src="artworks/thumbs/${esc(w._id)}.avif"
               alt="${esc(currentTitle)}"
               loading="lazy">
          <div class="work-id">${esc(w._id.replace('art', ''))}</div>
          <textarea class="work-title${changes[w._id] ? ' changed' : ''}"
                    rows="2"
                    data-id="${esc(w._id)}"
                    data-orig="${esc(w.title ?? 'Untitled')}"
          >${esc(currentTitle)}</textarea>`;

        const ta = card.querySelector('.work-title');
        ta.addEventListener('input', () => onTitleChange(ta, w));
        ta.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); ta.blur(); } });

        row.appendChild(card);
      });

      group.appendChild(row);
      main.appendChild(group);
    });
  }

  // ── Title edit ───────────────────────────────────────────────
  function onTitleChange(ta, w) {
    const val  = ta.value.trim();
    const orig = ta.dataset.orig;
    const id   = ta.dataset.id;

    if (val && val !== orig) {
      changes[id] = val;
      ta.classList.add('changed');
      ta.closest('.work-card').classList.add('renamed');
    } else {
      delete changes[id];
      ta.classList.remove('changed');
      ta.closest('.work-card').classList.remove('renamed');
    }

    // Update stats without full re-render
    const pending = Object.keys(changes).length;
    document.getElementById('save-btn').disabled = pending === 0;
    const stats = document.getElementById('stats');
    const base  = stats.textContent.replace(/ · \d+ unsaved.*$/, '');
    stats.textContent = base + (pending ? ` · ${pending} unsaved change${pending > 1 ? 's' : ''}` : '');
  }

  // ── Save ─────────────────────────────────────────────────────
  async function saveChanges() {
    if (!Object.keys(changes).length) return;
    const btn = document.getElementById('save-btn');
    btn.disabled = true;
    setStatus('Saving and rebuilding catalog…', 'saving');

    try {
      const res = await fetch('/rename-works', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(changes),
      });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || 'Server error');

      setStatus(
        `✓ ${data.changed} title${data.changed !== 1 ? 's' : ''} saved · catalog rebuilt`,
        'ok'
      );

      // Update catalog in memory so re-render reflects changes
      const map = {};
      catalog.forEach(w => { map[w.file.replace('.avif', '')] = w; });
      Object.entries(changes).forEach(([id, title]) => {
        if (map[id]) map[id].title = title;
      });
      changes = {};
      render();

    } catch (err) {
      setStatus('Error: ' + err.message, 'err');
      btn.disabled = false;
    }
  }

  // ── Auto-number a single group ────────────────────────────────
  window.autoNumberGroup = function(btn) {
    const group = btn.closest('.group');
    const cards = group.querySelectorAll('.work-card');
    cards.forEach((card, i) => {
      const ta   = card.querySelector('.work-title');
      const orig = ta.dataset.orig;
      // Strip any trailing number already applied
      const base = orig.replace(/\s+\d+$/, '').trim();
      const next = base + ' ' + (i + 1);
      ta.value = next;
      const w = { _id: card.dataset.id, title: ta.dataset.orig };
      onTitleChange(ta, w);
    });
  };

  // ── Auto-number all duplicate groups ─────────────────────────
  window.autoNumberAll = function() {
    document.querySelectorAll('.group').forEach(group => {
      const cards = group.querySelectorAll('.work-card');
      if (cards.length < 2) return;
      cards.forEach((card, i) => {
        const ta   = card.querySelector('.work-title');
        const base = ta.dataset.orig.replace(/\s+\d+$/, '').trim();
        ta.value = base + ' ' + (i + 1);
        onTitleChange(ta, { _id: card.dataset.id, title: ta.dataset.orig });
      });
    });
  };

  // ── Mode toggle ───────────────────────────────────────────────
  window.setMode = function(m) {
    mode = m;
    document.getElementById('btn-dupes').classList.toggle('active', m === 'dupes');
    document.getElementById('btn-all').classList.toggle('active', m === 'all');
    render();
  };

  window.saveChanges = saveChanges;

  // ── Helpers ───────────────────────────────────────────────────
  function setStatus(msg, cls) {
    const el = document.getElementById('status-bar');
    el.textContent = msg;
    el.className = 'status-bar' + (cls ? ' status-' + cls : '');
  }

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
})();
</script>
</body>
</html>
