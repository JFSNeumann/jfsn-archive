<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Not Found — Jeffrey F. S. Neumann</title>
<meta name="description" content="Page not found.">
<meta name="theme-color" content="#0c0a09">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/playfair-display-italic-latin.woff2" as="font" type="font/woff2" crossorigin>
<script>document.documentElement.classList.add('js')</script>
<style>
  @media (prefers-reduced-motion: no-preference){
    .js body{animation:room-in .4s ease}
    @keyframes room-in{from{opacity:0}to{opacity:1}}
  }
  #room-veil{position:fixed;inset:0;background:#0c0a09;opacity:0;pointer-events:none;transition:opacity .22s ease;z-index:99}
  #room-veil.on{opacity:1;pointer-events:auto}
</style>
<script>
addEventListener('DOMContentLoaded', () => {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const v = document.createElement('div'); v.id = 'room-veil';
  document.body.appendChild(v);
  document.addEventListener('click', e => {
    const a = e.target.closest('a');
    if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || a.target === '_blank') return;
    const h = a.getAttribute('href') || '';
    if (!h || /^(https?:|#|mailto:)/.test(h)) return;
    e.preventDefault();
    v.classList.add('on');
    setTimeout(() => { location.href = a.href; }, 200);
  }, true);
  addEventListener('pageshow', e => { if (e.persisted) v.classList.remove('on'); });
});
</script>
<style>
  :root{
    --room:#0c0a09;
    --ink:#f0e8dd;
    --dim:#b8a89a;
    --faint:#8a7a6c;
    --frame:#2b241e;
    --accent:#FF6600;
  }
  @font-face{font-family:'Playfair Display';src:url('/fonts/playfair-display-italic-latin.woff2') format('woff2');font-style:italic;font-weight:400 900;font-display:swap}
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--room);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    position:relative;
  }
  body::before{
    content:'';position:fixed;inset:0;
    background-image:url('/artworks/medium/art0273.avif');
    background-size:cover;background-position:center;
    background-color:var(--room);
    opacity:0.15;z-index:-1;pointer-events:none;
    will-change:transform;
    transform:translateY(var(--parallax-y, 0));
  }
  ::selection{background:var(--accent);color:#0c0a09}
  a{color:var(--dim);text-decoration:none;transition:color .25s}
  a:hover{color:var(--accent);text-decoration:underline}
  a:focus-visible{outline:2px solid var(--accent);outline-offset:4px;color:var(--accent)}
  .caps{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--dim)}
  .serif{font-family:Georgia,'Times New Roman',serif}

  header.hud{
    position:fixed;top:0;left:0;right:0;z-index:10;
    display:flex;justify-content:space-between;align-items:baseline;
    padding:calc(env(safe-area-inset-top,0px) + 22px) 26px 14px;
    background:linear-gradient(var(--room) 55%,rgba(12,10,9,0.82) 78%,transparent);
    pointer-events:none;
  }
  header.hud a{pointer-events:auto}
  header.hud .who{font-size:11px;letter-spacing:.22em;font-weight:600;color:var(--ink)}
  header.hud a.who:hover{color:var(--accent)}
  header.hud .room-name{color:var(--faint)}
  @media (max-width:640px){ header.hud .room-name{display:none} }

  #hero{
    min-height:100vh;display:flex;flex-direction:column;
    justify-content:center;align-items:center;text-align:center;gap:24px;
    padding:80px 26px;
  }
  #hero h1{
    font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:400;
    font-size:clamp(48px,8vw,72px);line-height:1.15;max-width:14em;
  }
  .highlight-devo{background:var(--accent);color:#0c0a09;padding:0 4px;font-style:normal}
  #hero .subtitle{color:var(--dim);font-size:clamp(16px,2vw,20px);max-width:28em;line-height:1.7;margin-top:12px}
  #hero .bridge{color:var(--faint);font-size:13px;letter-spacing:.08em;margin:24px 0 0;max-width:28em}
  #hero .bridge a{color:var(--dim)}

  .threshold{
    display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:48px;max-width:720px;
  }
  @media (max-width:640px){
    .threshold{grid-template-columns:1fr;gap:24px}
  }
  .threshold a{
    display:flex;flex-direction:column;gap:12px;padding:32px;
    border:1px solid var(--frame);background:rgba(43,36,30,0.4);
    transition:all .25s ease;
  }
  .threshold a:hover{
    background:rgba(43,36,30,0.8);border-color:var(--accent);
  }
  .threshold .label{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
  .threshold .label:hover{color:var(--accent)}
  .threshold .text{font-size:18px;color:var(--ink);letter-spacing:-.015em}

  @media (prefers-reduced-motion: no-preference) {
    #hero h1 { animation: fade-up 0.6s ease-out 0.1s both; }
    #hero .subtitle { animation: fade-up 0.6s ease-out 0.2s both; }
    #hero .bridge { animation: fade-up 0.6s ease-out 0.3s both; }
    .threshold { animation: fade-up 0.6s ease-out 0.4s both; }
  }

  @keyframes fade-up {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  footer{
    position:fixed;bottom:0;left:0;right:0;z-index:5;
    padding:32px 26px calc(env(safe-area-inset-bottom,0px) + 32px);
    background:linear-gradient(transparent, var(--room) 40%);
    pointer-events:none;
  }
  footer a{pointer-events:auto}
  footer .stat{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:16px}
</style>
</head>
<body>

<header class="hud">
  <a href="/" class="who">JFSN</a>
  <span class="room-name caps">Lost Passage</span>
</header>

<main id="hero">
  <h1>This <span class="highlight-devo">room</span> is<br>not yet built.</h1>

  <p class="subtitle">
    The page you're looking for may have moved, or never existed.
  </p>

  <div class="threshold">
    <a href="/archive.html">
      <span class="label">Begin here</span>
      <span class="text">The Archive</span>
    </a>
    <a href="/">
      <span class="label">Return to</span>
      <span class="text">The Museum</span>
    </a>
  </div>
</main>

<footer>
  <div class="stat">1,086 Works · 50 Years · 1974–Present · Cleveland, OH</div>
</footer>

</body>
</html>
