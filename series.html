  <link rel="alternate" type="application/rss+xml" title="Jeffrey F. S. Neumann — Archive" href="https://jfsn.com/feed.xml">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">

  <style>
    /* -------- Series hero -------- */
    .series-hero {
      padding: clamp(3rem, 6vw, 6rem) 0 clamp(1.5rem, 3vw, 2.5rem);
    }
    .series-label {
      display: inline-block;
      font-size: var(--cap);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 0.75rem;
      transition: color 0.15s;
    }
    a.series-label:hover { color: var(--accent); }
    .series-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 1rem 4rem;
      margin-bottom: 1.5rem;
    }
    .series-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(2.5rem, 5.5vw, 4.5rem);
      font-weight: 300;
      letter-spacing: -0.01em;
      line-height: 1.1;
      margin: 0;
    }
    .series-aside {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding-bottom: 0.2rem;
      flex-shrink: 0;
    }
    .series-count {
      font-size: var(--cap);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .series-archive-link {
      font-size: var(--cap);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--dim);
      padding-bottom: 0.1rem;
      transition: color 0.15s, border-color 0.15s;
    }
    .series-archive-link:hover {
      color: var(--accent);
      border-color: var(--accent);
    }
    .series-description {
      font-size: clamp(0.9375rem, 1.25vw, 1.0625rem);
      line-height: 1.78;
      color: var(--muted);
      max-width: 64ch;
      margin: 0;
    }
    .series-divider {
      border: none;
      border-top: 1px solid var(--dim);
      margin: clamp(1.5rem, 3vw, 2.5rem) 0 0;
    }

    /* -------- Grid bar -------- */
    .grid-bar {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 1.25rem 0 0.875rem;
    }
    .grid-count {
      font-size: var(--cap);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .density-btn {
      appearance: none;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: var(--cap);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 0;
      transition: color 0.15s;
    }
    .density-btn:hover { color: var(--text); }

    /* -------- Grid (masonry) -------- */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: 8px;
      column-gap: 1rem;
      row-gap: 0;
      padding-bottom: clamp(4rem, 8vw, 8rem);
    }
    .grid.dense { grid-template-columns: repeat(6, 1fr); }
    .grid.dense .thumb__caption { display: none; }

    .thumb { margin: 0; transition: opacity 0.25s; }
    .thumb__link {
      display: block;
      overflow: hidden;
      background: #111;
      position: relative;
    }
    .thumb__link img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.3s;
    }
    @media (hover: hover) { .thumb__link:hover img { transform: scale(1.05); } }
    .thumb__overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(11,11,11,0.82) 0%, transparent 60%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0.75rem;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.22s, transform 0.22s;
      pointer-events: none;
    }
    @media (hover: hover) {
      .thumb__link:hover .thumb__overlay { opacity: 1; transform: translateY(0); }
      /* Sibling dim — spotlights the hovered card */
      .grid:has(.thumb__link:hover) .thumb { opacity: 0.5; }
      .grid:has(.thumb__link:hover) .thumb:hover { opacity: 1; }
    }
    @media (hover: none) {
      .thumb__overlay { opacity: 1; transform: translateY(0); }
    }
    .thumb__overlay-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 0.9375rem;
      font-weight: 300;
      color: #fff;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 0.2rem;
    }
    .thumb__overlay-type {
      font-size: 0.625rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
    }
    .thumb__caption {
      margin-top: 0.5rem;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 0.875rem;
      font-weight: 300;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .empty {
      grid-column: 1 / -1;
      padding: 5rem 0;
      text-align: center;
      font-size: var(--cap);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* -------- Skeleton -------- */
    .skeleton {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      padding-bottom: clamp(4rem, 8vw, 8rem);
    }
    .skeleton__item {
      aspect-ratio: 1;
      background: rgba(243,240,234,0.05);
      animation: pulse 1.8s ease-in-out infinite;
    }
    .skeleton__item:nth-child(2) { animation-delay: 0.1s; }
    .skeleton__item:nth-child(3) { animation-delay: 0.2s; }
    .skeleton__item:nth-child(4) { animation-delay: 0.3s; }
    @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.8; } }

    /* -------- Error -------- */
    .error {
      padding: clamp(4rem, 10vw, 8rem) 0;
      text-align: center;
      color: var(--muted);
      font-size: var(--cap);
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .error a { color: var(--text); }

    /* -------- Responsive -------- */
    @media (max-width: 1024px) {
      .grid, .skeleton { grid-template-columns: repeat(3, 1fr); }
      .grid.dense { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 600px) {
      .grid, .skeleton { grid-template-columns: repeat(2, 1fr); }
      .grid.dense { grid-template-columns: repeat(3, 1fr); }
      .series-aside { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
    }

    /* -------- More series -------- */
    .more-series {
      padding: clamp(1.5rem, 3vw, 2.5rem) 0 clamp(3rem, 6vw, 5rem);
      border-top: 1px solid var(--dim);
    }
    .more-series__label {
      font-size: var(--cap);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 0.75rem;
    }
    .more-series__links {
      display: flex;
      flex-wrap: wrap;
      column-gap: 1.5rem;
      row-gap: 0.3rem;
    }
    .more-series__link {
      font-size: var(--cap);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      transition: color 0.15s;
    }
    .more-series__link:hover { color: var(--text); }

    /* -------- Reduced motion -------- */
    @media (prefers-reduced-motion: reduce) {
      .thumb,
      .thumb__link img,
      .thumb__overlay,
      .more-series__link { transition: none; }
      .thumb__link:hover img { transform: none; }
      .thumb__overlay { transform: none; }
      .grid:has(.thumb__link:hover) .thumb { opacity: 1; }
      .skeleton__item { animation: none; opacity: 0.4; }
    }
  </style>
  <script src="artist-config.js"></script>
</head>

<script>
(function () {

  /* ---- series metadata: theme-based series (filter by r.themes[]) ---- */
  /* Theme + named-series data — from artist-config.js (generated by build_catalog.py).
     Falls back to empty objects if config unavailable. */
  const _C = window.ARCHIVE_CONFIG || {};
  const SERIES = Object.fromEntries(
    (_C.themes || []).map(t => [t.name, { title: t.displayTitle, description: t.description }])
  );
  const NAMED_SERIES = Object.fromEntries(
    (_C.namedSeries || []).map(s => [s.key, { title: s.displayTitle, description: s.description }])
  );

  const TYPE_LABELS = {
    collage:           'Collage',
    sculpture:         'Sculpture',
    painting:          'Painting',
    photograph:        'Photograph',
    installation_view: 'Installation',
  };

  const PAGE_SIZE = 60;

  const params      = new URLSearchParams(location.search);
  const themeParam  = params.get('theme')  || '';
  const seriesParam = params.get('series') || '';

  /* ---- resolve series metadata and filter strategy ---- */
  let series, filterFn, archiveParam, artworkParam, currentKey;
  if (seriesParam && NAMED_SERIES[seriesParam]) {
    series      = NAMED_SERIES[seriesParam];
    filterFn    = r => r.series === seriesParam;
    archiveParam = 'series=' + encodeURIComponent(seriesParam);
    artworkParam = 'series=' + encodeURIComponent(seriesParam);
    currentKey   = seriesParam;
  } else if (themeParam && SERIES[themeParam]) {
    series      = SERIES[themeParam];
    filterFn    = r => (r.themes || []).includes(themeParam);
    archiveParam = 'theme=' + encodeURIComponent(themeParam);
    artworkParam = 'theme=' + encodeURIComponent(themeParam);
    currentKey   = themeParam;
  } else {
    const label = themeParam || seriesParam;
    document.getElementById('series-hero').innerHTML = `
      <div class="error">
        <p>${label ? `"${esc(label)}" series not found` : 'No series specified'}</p>
        <p style="margin-top:1.5rem"><a href="archive.html">&#8592; Back to archive</a></p>
      </div>`;
    document.getElementById('grid-wrap').innerHTML = '';
    document.getElementById('grid-count').textContent = '';
    document.getElementById('density-btn').hidden = true;
    document.title = 'Series not found — Jeffrey F. S. Neumann';
    return;
  }

  /* ---- update page metadata ---- */
  document.title = `${series.title} — Jeffrey F. S. Neumann`;
  document.querySelector('meta[name="description"]')
    .setAttribute('content', series.description.slice(0, 160));
  document.querySelector('meta[property="og:title"]')
    .setAttribute('content', `${series.title} — Jeffrey F. S. Neumann`);
  const canonEl = document.querySelector('link[rel="canonical"]');
  if (canonEl) canonEl.setAttribute('href', `https://jfsn.com/series.html?${archiveParam}`);

  /* ---- more series (immediate — no network needed) ---- */
  const moreSeriesLinks = document.getElementById('more-series-links');
  const moreSeriesWrap  = document.getElementById('more-series');
  if (moreSeriesLinks) {
    const allLinks = [
      ...Object.entries(SERIES).map(([k, s]) =>
        ({ key: k, title: s.title, url: `series.html?theme=${encodeURIComponent(k)}` })),
      ...Object.entries(NAMED_SERIES).map(([k, s]) =>
        ({ key: k, title: s.title, url: `series.html?series=${encodeURIComponent(k)}` })),
    ];
    moreSeriesLinks.innerHTML = allLinks
      .filter(s => s.key !== currentKey)
      .map(s => `<a class="more-series__link" href="${esc(s.url)}">${esc(s.title)}</a>`)
      .join('');
    if (moreSeriesWrap) moreSeriesWrap.hidden = false;
  }

  /* ---- render hero immediately (no network) ---- */
  const archiveURL = `archive.html?${archiveParam}`;
  document.getElementById('series-hero').innerHTML = `
    <a class="series-label" href="series-index.html">&#8592; All series</a>
    <div class="series-head">
      <h1 class="series-title">${esc(series.title)}</h1>
      <div class="series-aside">
        <span class="series-count" id="series-count"></span>
        <a class="series-archive-link" href="${esc(archiveURL)}">View in archive &rarr;</a>
      </div>
    </div>
    <p class="series-description">${esc(series.description)}</p>
    <hr class="series-divider">
  `;

  /* ---- scroll-to-top + progress bar ---- */
  const scrollTopBtn = document.getElementById('scroll-top');
  const progressBar  = document.getElementById('scroll-progress');
  window.addEventListener('scroll', () => {
    scrollTopBtn.classList.toggle('visible', window.scrollY > 800);
    if (progressBar) {
      const total = document.documentElement.scrollHeight - window.innerHeight;
      progressBar.style.width = (total > 0 ? (window.scrollY / total) * 100 : 0).toFixed(1) + '%';
    }
  }, { passive: true });
  scrollTopBtn.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  /* ---- density ---- */
  let dense = localStorage.getItem('archive-density') === 'compact';
  const densityBtn = document.getElementById('density-btn');

  function applyDensity() {
    const grid = document.querySelector('.grid');
    if (grid) grid.classList.toggle('dense', dense);
    densityBtn.textContent = dense ? 'Normal' : 'Compact';
    requestAnimationFrame(recalcAllSpans);
  }

  densityBtn.addEventListener('click', () => {
    dense = !dense;
    localStorage.setItem('archive-density', dense ? 'compact' : 'normal');
    applyDensity();
  });

  /* ---- masonry constants + state ---- */
  const ROW_H   = 8;  /* px — must match grid-auto-rows */
  const COL_GAP = 16; /* px — 1rem, vertical separation between items */
  const CAP_H   = 32; /* px — single-line caption (margin-top + text) */

  let works        = [];
  let masonryDims  = null;
  let masonryObs   = null;
  let renderedCount = 0;
  let loadObserver  = null;

  /* ---- fetch catalog + image dimensions + dominant colors in parallel ---- */
  let dominantColors = {};
  Promise.all([
    fetch('catalog-lite.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
    fetch('dims.json').then(r => r.json()).catch(() => null),
    fetch('colors.json').then(r => r.json()).catch(() => null),
  ])
    .then(([catalog, dims, colors]) => {
      masonryDims = dims;
      if (colors) dominantColors = colors;
      works = catalog.filter(filterFn);
      const countEl = document.getElementById('series-count');
      if (countEl) countEl.textContent = `${works.length} work${works.length !== 1 ? 's' : ''}`;
      renderGrid();
    })
    .catch(() => {
      document.getElementById('grid-wrap').innerHTML =
        '<p style="padding:4rem 0;text-align:center;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)">Could not load catalog.</p>';
    });

  /* ---- render grid ---- */
  function renderGrid() {
    renderedCount = 0;
    const total   = works.length;

    document.getElementById('grid-count').textContent =
      total + ' work' + (total !== 1 ? 's' : '');

    const wrap = document.getElementById('grid-wrap');
    /* Remove the skeleton placeholder on first real render */
    const skeleton = wrap.querySelector('.skeleton');
    if (skeleton) skeleton.remove();
    if (!wrap.querySelector('.grid')) {
      const g = document.createElement('div'); g.className = 'grid'; g.id = 'grid';
      wrap.appendChild(g);
      const s = document.createElement('div'); s.id = 'load-sentinel';
      wrap.appendChild(s);
    }
    const grid = document.getElementById('grid');
    grid.replaceChildren();
    observeMasonry(grid);

    if (total === 0) {
      grid.innerHTML = '<p class="empty">No works cataloged for this series yet.</p>';
      applyDensity(); return;
    }

    appendBatch(grid);
    setupLoadMore();
  }

  function appendBatch(grid) {
    grid = grid || document.getElementById('grid');
    if (!grid) return;
    const slice = works.slice(renderedCount, renderedCount + PAGE_SIZE);
    if (!slice.length) return;
    const frag    = document.createDocumentFragment();
    const newFigs = [];
    slice.forEach(r => {
      const fig = buildFigure(r);
      newFigs.push(fig);
      frag.appendChild(fig);
    });
    grid.appendChild(frag);
    renderedCount += slice.length;
    applyDensity();
    requestAnimationFrame(() => newFigs.forEach(setSpan));
  }

  function setupLoadMore() {
    if (loadObserver) { loadObserver.disconnect(); loadObserver = null; }
    const sentinel = document.getElementById('load-sentinel');
    if (!sentinel || renderedCount >= works.length) return;
    loadObserver = new IntersectionObserver(entries => {
      if (!entries[0].isIntersecting) return;
      if (renderedCount >= works.length) { loadObserver.disconnect(); return; }
      appendBatch();
    }, { rootMargin: '600px' });
    loadObserver.observe(sentinel);
  }

  /* ---- build figure ---- */
  function buildFigure(record) {
    const id          = record.file.replace('.avif', '');
    const typeLabel   = TYPE_LABELS[record.work_type] || record.work_type || '';
    const yearStr     = record.year ? String(record.year) : '';
    const overlayMeta = [yearStr, typeLabel].filter(Boolean).join(' · ');
    const title       = record.title || id;
    const href = `artwork.html?id=${id}&${artworkParam}`;
    const [imgW, imgH] = (masonryDims && masonryDims[id]) || [400, 400];
    const fig = document.createElement('figure');
    fig.className  = 'thumb';
    fig.dataset.id = id;
    const bgColor = dominantColors[id] ? `background-color:${dominantColors[id]};` : '';
    fig.innerHTML = `
      <a class="thumb__link" href="${esc(href)}" style="${bgColor}">
        <img srcset="artworks/mini/${esc(id)}.avif 200w, artworks/thumbs/${esc(id)}.avif 400w"
             sizes="(max-width:600px) calc(50vw - 1rem),(max-width:1024px) calc(33vw - 1rem),calc(25vw - 1rem)"
             src="artworks/thumbs/${esc(id)}.avif"
             alt="${esc(title)}" loading="lazy" width="${imgW}" height="${imgH}">
        <div class="thumb__overlay" aria-hidden="true">
          <span class="thumb__overlay-title">${esc(title)}</span>
          <span class="thumb__overlay-type">${esc(overlayMeta)}</span>
        </div>
      </a>
      <figcaption class="thumb__caption">${esc(title)}</figcaption>`;
    return fig;
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* ---- masonry span calculation ---- */
  function setSpan(fig) {
    if (!masonryDims) return;
    const id = fig.dataset.id;
    if (!id || !masonryDims[id]) return;
    const [w, h] = masonryDims[id];
    const colW   = fig.offsetWidth || 280;
    const imgH   = Math.round((colW / w) * h);
    const capH   = dense ? 0 : CAP_H;
    fig.style.gridRow = `span ${Math.ceil((imgH + capH + COL_GAP) / ROW_H)}`;
  }

  function recalcAllSpans() {
    const grid = document.getElementById('grid');
    if (!grid || !masonryDims) return;
    grid.querySelectorAll('.thumb').forEach(setSpan);
  }

  function observeMasonry(grid) {
    if (masonryObs) masonryObs.disconnect();
    masonryObs = new ResizeObserver(() => recalcAllSpans());
    masonryObs.observe(grid);
  }

  /* ---- full-res hover preload ---- */
  (function () {
    const wrap = document.getElementById('grid-wrap');
    if (!wrap) return;
    const noMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    wrap.addEventListener('mouseover', function (e) {
      const link = e.target.closest('.thumb__link');
      if (!link || link.dataset.fullLoaded) return;
      link.dataset.fullLoaded = '1';
      const img = link.querySelector('img');
      const fig = link.closest('[data-id]');
      if (!img || !fig) return;
      const preload = new Image();
      preload.onload = function () {
        if (!link.matches(':hover')) return;
        if (noMotion) { img.srcset = ''; img.src = preload.src; return; }
        img.style.opacity = '0';
        requestAnimationFrame(() => requestAnimationFrame(() => {
          img.srcset = '';
          img.src    = preload.src;
          img.style.opacity = '1';
        }));
      };
      preload.src = 'artworks/full/' + fig.dataset.id + '.avif';
    });
  })();

})();
</script>

<script>
/* Series room entrance */
(function(){
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const params = new URLSearchParams(location.search);
  const key = params.get('theme') || params.get('series');
  if (!key) return;
  const overlay = document.createElement('div');
  overlay.id = 'series-room';
  overlay.setAttribute('aria-hidden', 'true');
  overlay.innerHTML = '<div id="series-room-inner"><p id="series-room-name"></p><p id="series-room-hint">click or press any key to skip</p></div>';
  document.body.appendChild(overlay);
  const style = document.createElement('style');
  style.textContent = `
    #series-room {
      position: fixed; inset: 0; z-index: 500;
      background: #0b0b0b;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.6s ease;
    }
    #series-room.fade { opacity: 0; pointer-events: none; }
    #series-room-inner { text-align: center; }
    #series-room-name {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(3rem, 9vw, 8rem);
      font-weight: 300;
      letter-spacing: -0.01em;
      color: #f3f0ea;
      margin: 0;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    #series-room-name.visible { opacity: 1; transform: none; }
    #series-room-hint {
      font-size: 0.65rem; letter-spacing: 0.16em; text-transform: uppercase;
      color: rgba(243,240,234,0.3); margin: 2rem 0 0;
      opacity: 0; transition: opacity 0.4s 0.6s;
    }
    #series-room-hint.visible { opacity: 1; }
  `;
  document.head.appendChild(style);
  function dismiss() {
    overlay.classList.add('fade');
    setTimeout(() => overlay.remove(), 700);
    document.removeEventListener('keydown', dismiss);
    overlay.removeEventListener('click', dismiss);
  }
  overlay.addEventListener('click', dismiss);
  document.addEventListener('keydown', dismiss);
  // Populate name once config loads
  function tryPopulate() {
    const C = window.ARCHIVE_CONFIG;
    if (!C) { setTimeout(tryPopulate, 50); return; }
    const themes = Object.fromEntries((C.themes||[]).map(t=>[t.name,t.displayTitle]));
    const named  = Object.fromEntries((C.namedSeries||[]).map(s=>[s.key,s.displayTitle]));
    const name   = themes[key] || named[key] || key;
    document.getElementById('series-room-name').textContent = name;
    setTimeout(() => {
      document.getElementById('series-room-name').classList.add('visible');
      document.getElementById('series-room-hint').classList.add('visible');
    }, 80);
    setTimeout(dismiss, 2200);
  }
  tryPopulate();
})();
</script>
