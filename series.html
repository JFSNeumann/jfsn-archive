  <style>
    /* -------- Series hero -------- */
    .series-hero {
      padding: clamp(3rem, 6vw, 6rem) 20px clamp(1.5rem, 3vw, 2.5rem);
    }
    @media (min-width: 768px) {
      .series-hero { padding-left: 48px; padding-right: 48px; }
      .grid-bar    { padding-left: 48px; padding-right: 48px; }
    }
    .series-label {
      display: inline-block;
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #575757;
      margin: 0 0 0.75rem;
    }
    a.series-label:hover { color: #FF6600; }
    .series-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 1rem 4rem;
      margin-bottom: 1.5rem;
    }
    .series-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(2.5rem, 5.5vw, 4.5rem);
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.1;
      margin: 0;
    }
    .series-aside {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding-bottom: 0.2rem;
      flex-shrink: 0;
    }
    .series-count {
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #575757;
    }
    .series-archive-link {
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #575757;
      border-bottom: 1px solid rgba(11,11,11,0.12);
      padding-bottom: 0.1rem;
    }
    .series-archive-link:hover {
      color: #FF6600;
      border-color: #FF6600;
    }
    .series-description {
      font-size: clamp(0.9375rem, 1.25vw, 1.0625rem);
      line-height: 1.78;
      color: #575757;
      max-width: 64ch;
      margin: 0;
    }
    .series-divider {
      border: none;
      border-top: 1px solid rgba(11,11,11,0.12);
      margin: clamp(1.5rem, 3vw, 2.5rem) 0 0;
    }

    /* -------- Grid bar -------- */
    .grid-bar {
      display: flex;
      align-items: baseline;
      padding: 1.25rem 20px 0.875rem;
    }
    .grid-count {
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #575757;
    }

    /* -------- Grid (masonry) -------- */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: 8px;
      column-gap: 1rem;
      row-gap: 0;
      padding-bottom: clamp(4rem, 8vw, 8rem);
    }
    .thumb { margin: 0; }
    .thumb__link {
      display: block;
      overflow: hidden;
      background: #111;
      position: relative;
    }
    .thumb__link img {
      width: 100%;
      height: auto;
      display: block;
    }
    .thumb__caption {
      margin-top: 0.5rem;
      font-family: Inter, sans-serif;
      font-size: 0.875rem;
      font-weight: 400;
      color: #0B0B0B;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .empty {
      grid-column: 1 / -1;
      padding: 5rem 0;
      text-align: center;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #575757;
    }

    /* -------- Skeleton (static) -------- */
    .skeleton {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      padding-bottom: clamp(4rem, 8vw, 8rem);
    }
    .skeleton__item {
      aspect-ratio: 1;
      background: rgba(11,11,11,0.06);
    }

    /* -------- Error -------- */
    .error {
      padding: clamp(4rem, 10vw, 8rem) 0;
      text-align: center;
      color: #575757;
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .error a { color: #0B0B0B; }

    /* -------- Responsive -------- */
    @media (max-width: 1024px) {
      .grid, .skeleton { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 600px) {
      .grid, .skeleton { grid-template-columns: repeat(2, 1fr); }
      .series-aside { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
    }

    /* -------- Nav -------- */
    .nav-underline-active { position: relative; }
    .nav-underline-active::after {
      content: ''; position: absolute; bottom: -4px; left: 0;
      width: 100%; height: 2px; background-color: #FF6600;
    }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

<script>
(function(){
  var menu    = document.getElementById('mobile-menu');
  var drawer  = document.getElementById('mobile-menu-drawer');
  var openBtn = document.getElementById('nav-menu-btn');
  var closeBtn= document.getElementById('nav-menu-close');
  var backdrop= document.getElementById('mobile-menu-backdrop');
  var menuSearchBtn = document.getElementById('mobile-menu-search');

  function openMenu(){
    menu.style.display = 'block';
    menu.setAttribute('aria-hidden','false');
    document.body.style.overflow = 'hidden';
    requestAnimationFrame(function(){
      drawer.style.transform = 'translateX(0)';
    });
    closeBtn.focus();
  }
  function closeMenu(){
    drawer.style.transform = 'translateX(100%)';
    document.body.style.overflow = '';
    setTimeout(function(){ menu.style.display = 'none'; menu.setAttribute('aria-hidden','true'); }, 260);
    openBtn.focus();
  }

  if(openBtn)  openBtn.addEventListener('click', openMenu);
  if(closeBtn) closeBtn.addEventListener('click', closeMenu);
  if(backdrop) backdrop.addEventListener('click', closeMenu);
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && menu.style.display==='block') closeMenu(); });

  // Wire search button in menu to open search overlay
  if(menuSearchBtn) menuSearchBtn.addEventListener('click', function(){
    closeMenu();
    setTimeout(function(){ if(window.openSiteSearch) window.openSiteSearch(); }, 280);
  });
})();
</script>

<script>
(function(){
  var header = document.querySelector('header');
  if (!header) return;
  var lastY = window.scrollY;
  var menuOpen = false;
  var openBtn = document.getElementById('nav-menu-btn');
  var closeBtn = document.getElementById('nav-menu-close');
  var backdrop = document.getElementById('mobile-menu-backdrop');
  if (openBtn)  openBtn.addEventListener('click',  function(){ menuOpen = true; });
  if (closeBtn) closeBtn.addEventListener('click', function(){ menuOpen = false; });
  if (backdrop) backdrop.addEventListener('click', function(){ menuOpen = false; });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') menuOpen = false; });
  window.addEventListener('scroll', function(){
    var y = window.scrollY;
    header.classList.toggle('header-scrolled', y > 8);
    if (!menuOpen) {
      if (y > lastY && y > 80) {
        header.classList.add('header-hidden');
      } else {
        header.classList.remove('header-hidden');
      }
    }
    lastY = y;
  }, { passive: true });
})();
</script>

/* ─── Dark Mode Toggle (Phase 2) ─────────────────────────────────────────── */
(function() {

  var moonIcon = document.getElementById('theme-icon-moon');

  // Detect preference: localStorage > prefers-color-scheme
  function getTheme() {
    var saved = localStorage.getItem('jfsn-theme');
    if (saved) return saved;
    if (window.matchMedia('(prefers-color-scheme: dark)').matches) return 'dark';
    return 'light';
  }

  function setTheme(theme) {
    localStorage.setItem('jfsn-theme', theme);
    var html = document.documentElement;
    if (theme === 'dark') {
      html.classList.add('dark');
      sunIcon.style.display = 'block';
      moonIcon.style.display = 'none';
    } else {
      html.classList.remove('dark');
      sunIcon.style.display = 'none';
      moonIcon.style.display = 'block';
    }
  }

  // Initialize theme on page load
  var currentTheme = getTheme();
  setTheme(currentTheme);

  // Toggle on button click
  if (themeToggle) {
    themeToggle.addEventListener('click', function() {
      var newTheme = getTheme() === 'dark' ? 'light' : 'dark';
      setTheme(newTheme);
    });
  }

  // Listen for system theme changes
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
    if (!localStorage.getItem('jfsn-theme')) {
      setTheme(e.matches ? 'dark' : 'light');
    }
  });
})();
</script>

<script>
(function () {

  const _C = window.ARCHIVE_CONFIG || {};
  const SERIES = Object.fromEntries(
    (_C.themes || []).map(t => [t.name, { title: t.displayTitle, description: t.description }])
  );
  const NAMED_SERIES = Object.fromEntries(
    (_C.namedSeries || []).map(s => [s.key, { title: s.displayTitle, description: s.description }])
  );

  const TYPE_LABELS = {
    collage:           'Collage',
    sculpture:         'Sculpture',
    painting:          'Painting',
    photograph:        'Photograph',
    installation_view: 'Installation',
  };

  const PAGE_SIZE = 60;
  const ROW_H     = 8;
  const COL_GAP   = 16;
  const CAP_H     = 32;

  const params      = new URLSearchParams(location.search);
  const themeParam  = params.get('theme')  || '';
  const seriesParam = params.get('series') || '';

  let series, filterFn, archiveParam, artworkParam, currentKey;
  if (seriesParam && NAMED_SERIES[seriesParam]) {
    series       = NAMED_SERIES[seriesParam];
    filterFn     = r => r.series === seriesParam;
    archiveParam = 'series=' + encodeURIComponent(seriesParam);
    artworkParam = 'series=' + encodeURIComponent(seriesParam);
    currentKey   = seriesParam;
  } else if (themeParam && SERIES[themeParam]) {
    series       = SERIES[themeParam];
    filterFn     = r => (r.themes || []).includes(themeParam);
    archiveParam = 'theme=' + encodeURIComponent(themeParam);
    artworkParam = 'theme=' + encodeURIComponent(themeParam);
    currentKey   = themeParam;
  } else {
    const label = themeParam || seriesParam;
    document.getElementById('series-hero').innerHTML = `
      <div class="error">
        <p>${label ? `"${esc(label)}" series not found` : 'No series specified'}</p>
        <p style="margin-top:1.5rem"><a href="archive.html">&#8592; Back to archive</a></p>
      </div>`;
    document.getElementById('grid-wrap').innerHTML = '';
    document.getElementById('grid-count').textContent = '';
    document.title = 'Series not found — Jeffrey F. S. Neumann';
    return;
  }

  document.title = `${series.title} — Jeffrey F. S. Neumann`;
  document.querySelector('meta[name="description"]')
    .setAttribute('content', series.description.slice(0, 160));
  document.querySelector('meta[property="og:title"]')
    .setAttribute('content', `${series.title} — Jeffrey F. S. Neumann`);
  document.querySelector('meta[property="og:description"]')
    .setAttribute('content', series.description
      ? series.description.slice(0, 155)
      : `${series.title} — a recurring series from the archive of Jeffrey F. S. Neumann.`);
  const canonEl = document.querySelector('link[rel="canonical"]');
  if (canonEl) canonEl.setAttribute('href', `https://jfsn.com/series.html?${archiveParam}`);

  const archiveURL = `archive.html?${archiveParam}`;
  document.getElementById('series-hero').innerHTML = `
    <a class="series-label" href="series-index.html">&#8592; All series</a>
    <div class="series-head">
      <h1 class="series-title">${esc(series.title)}</h1>
      <div class="series-aside">
        <span class="series-count" id="series-count"></span>
        <a class="series-archive-link" href="${esc(archiveURL)}">View in archive &rarr;</a>
      </div>
    </div>
    <p class="series-description">${esc(series.description)}</p>
    <hr class="series-divider">
  `;

  let works        = [];
  let masonryDims  = null;
  let masonryObs   = null;
  let renderedCount = 0;
  let loadObserver  = null;
  let dominantColors = {};

  Promise.all([
    fetch('catalog-lite.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
    fetch('dims.json').then(r => r.json()).catch(() => null),
    fetch('colors.json').then(r => r.json()).catch(() => null),
  ])
    .then(([catalog, dims, colors]) => {
      masonryDims = dims;
      if (colors) dominantColors = colors;
      works = catalog.filter(filterFn);
      const countEl = document.getElementById('series-count');
      if (countEl) countEl.textContent = `${works.length} work${works.length !== 1 ? 's' : ''}`;
      renderGrid();
    })
    .catch(() => {
      document.getElementById('grid-wrap').innerHTML =
        '<p style="padding:4rem 0;text-align:center;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:#575757">Could not load catalog.</p>';
    });

  function renderGrid() {
    renderedCount = 0;
    const total = works.length;

    document.getElementById('grid-count').textContent =
      total + ' work' + (total !== 1 ? 's' : '');

    const wrap = document.getElementById('grid-wrap');
    const skeleton = wrap.querySelector('.skeleton');
    if (skeleton) skeleton.remove();
    if (!wrap.querySelector('.grid')) {
      const g = document.createElement('div'); g.className = 'grid'; g.id = 'grid';
      wrap.appendChild(g);
      const s = document.createElement('div'); s.id = 'load-sentinel';
      wrap.appendChild(s);
    }
    const grid = document.getElementById('grid');
    grid.replaceChildren();
    observeMasonry(grid);

    if (total === 0) {
      grid.innerHTML = '<p class="empty">No works cataloged for this series yet.</p>';
      return;
    }

    appendBatch(grid);
    setupLoadMore();
  }

  function appendBatch(grid) {
    grid = grid || document.getElementById('grid');
    if (!grid) return;
    const slice = works.slice(renderedCount, renderedCount + PAGE_SIZE);
    if (!slice.length) return;
    const frag    = document.createDocumentFragment();
    const newFigs = [];
    slice.forEach(r => {
      const fig = buildFigure(r);
      newFigs.push(fig);
      frag.appendChild(fig);
    });
    grid.appendChild(frag);
    renderedCount += slice.length;
    requestAnimationFrame(() => newFigs.forEach(setSpan));
  }

  function setupLoadMore() {
    if (loadObserver) { loadObserver.disconnect(); loadObserver = null; }
    const sentinel = document.getElementById('load-sentinel');
    if (!sentinel || renderedCount >= works.length) return;
    loadObserver = new IntersectionObserver(entries => {
      if (!entries[0].isIntersecting) return;
      if (renderedCount >= works.length) { loadObserver.disconnect(); return; }
      appendBatch();
    }, { rootMargin: '600px' });
    loadObserver.observe(sentinel);
  }

  function buildFigure(record) {
    const id        = record.file.replace('.avif', '');
    const typeLabel = TYPE_LABELS[record.work_type] || record.work_type || '';
    const title     = record.title || id;
    const href      = `artwork.html?id=${id}&${artworkParam}`;
    const [imgW, imgH] = (masonryDims && masonryDims[id]) || [400, 400];
    const fig = document.createElement('figure');
    fig.className  = 'thumb';
    fig.dataset.id = id;
    const bgColor  = dominantColors[id] ? `background-color:${dominantColors[id]};` : '';
    fig.innerHTML = `
      <a class="thumb__link" href="${esc(href)}" style="${bgColor}">
        <img srcset="artworks/mini/${esc(id)}.avif 200w, artworks/thumbs/${esc(id)}.avif 400w"
             sizes="(max-width:600px) calc(50vw - 1rem),(max-width:1024px) calc(33vw - 1rem),calc(25vw - 1rem)"
             src="artworks/thumbs/${esc(id)}.avif"
             alt="${esc(title)}" loading="lazy" width="${imgW}" height="${imgH}">
      </a>
      <figcaption class="thumb__caption">${esc(title)}</figcaption>`;
    return fig;
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function setSpan(fig) {
    if (!masonryDims) return;
    const id = fig.dataset.id;
    if (!id || !masonryDims[id]) return;
    const [w, h] = masonryDims[id];
    const colW   = fig.offsetWidth || 280;
    const imgH   = Math.round((colW / w) * h);
    fig.style.gridRow = `span ${Math.ceil((imgH + CAP_H + COL_GAP) / ROW_H)}`;
  }

  function recalcAllSpans() {
    const grid = document.getElementById('grid');
    if (!grid || !masonryDims) return;
    grid.querySelectorAll('.thumb').forEach(setSpan);
  }

  function observeMasonry(grid) {
    if (masonryObs) masonryObs.disconnect();
    masonryObs = new ResizeObserver(() => recalcAllSpans());
    masonryObs.observe(grid);
  }

})();
</script>
