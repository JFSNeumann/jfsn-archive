<!-- FOOTER:START -->
<style>
footer a{position:relative;text-decoration:none}
footer a::after{content:'';position:absolute;bottom:-1px;left:0;width:100%;height:1px;background:#FF6600;transform:scaleX(0);transform-origin:left center;transition:transform 0.2s ease}
footer a:hover::after{transform:scaleX(1)}
footer .hover\:border-international-orange::after{display:none}
@media(prefers-reduced-motion:reduce){footer a::after{transition:none}}
#back-to-top{background:none;border:none;cursor:pointer;font-family:Inter,sans-serif;font-size:10px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:#575757;display:flex;align-items:center;gap:5px;padding:0;transition:color 0.15s ease}
#back-to-top:hover{color:#0B0B0B}
#back-to-top::after{display:none}
/* Floating back-to-top button */
#btt-float{position:fixed;bottom:28px;right:28px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:#fcf9f3;border:1px solid #c4c7c7;cursor:pointer;font-size:16px;color:#575757;z-index:400;opacity:0;transform:translateY(8px);transition:opacity 0.22s ease,transform 0.22s ease,color 0.15s ease,border-color 0.15s ease;pointer-events:none;}
#btt-float.btt-visible{opacity:1;transform:translateY(0);pointer-events:auto;}
#btt-float:hover{color:#FF6600;border-color:#FF6600;}
#btt-float::after{display:none}
@media(prefers-reduced-motion:reduce){#btt-float{transition:none;}}
/* On mobile, sit above the bottom nav bar */
@media(max-width:767px){#btt-float{bottom:72px;right:16px;}}
</style>
<footer class="bg-surface-container-high py-16 px-margin-desktop border-t border-outline-variant">
  <div class="max-w-container-max mx-auto">
  <div style="padding-top:16px;border-top:1px solid #c4c7c7;display:flex;flex-direction:column;md:flex-direction:row;justify-content:space-between;align-items:center;gap:16px;">
    <div style="display:flex;align-items:center;gap:8px;">
      <img src="_shared/butterfly-mark.png" alt="" width="12" height="12" style="opacity:0.6;" aria-hidden="true"/>
      <p style="font-family:Inter,sans-serif;font-size:10px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:#575757;margin:0;">© <span id="footer-year">2026</span> JEFFREY F. S. NEUMANN. ALL RIGHTS RESERVED.</p>
    </div>
    <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:center;">
      <button id="back-to-top" style="background:none;border:none;cursor:pointer;font-family:Inter,sans-serif;font-size:10px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:#575757;padding:0;transition:color 0.15s ease;" aria-label="Back to top">↑ BACK TO TOP</button>
      <a style="font-family:Inter,sans-serif;font-size:10px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:#575757;text-decoration:none;transition:color 0.15s ease;padding:0;border:none;" href="https://github.com/JFSNeumann/jfsn-archive" target="_blank">OPEN SOURCE CODE</a>
      <a style="font-family:Inter,sans-serif;font-size:10px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:#575757;text-decoration:none;transition:color 0.15s ease;padding:0;border:none;" href="privacy.html">PRIVACY</a>
    </div>
  </div>
</footer>
<!-- Floating back-to-top -->
<button id="btt-float" aria-label="Back to top">↑</button>
<script>
document.getElementById('footer-year').textContent = new Date().getFullYear();
(function(){
  // Footer text button
  var btn = document.getElementById('back-to-top');
  if (btn) btn.addEventListener('click', function(){
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  // Floating button
  var floatBtn = document.getElementById('btt-float');
  if (!floatBtn) return;
  floatBtn.addEventListener('click', function(){
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  window.addEventListener('scroll', function(){
    floatBtn.classList.toggle('btt-visible', window.scrollY > 300);
  }, { passive: true });
})();
</script>
