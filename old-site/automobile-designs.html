    }
    @media (min-width: 992px) {

    .masonry-item {

    /* Design images styling */

      transition: all 0.3s ease;
      cursor: pointer;
      image-rendering: -webkit-optimize-contrast !important;
      image-rendering: crisp-edges !important;
      image-rendering: high-quality !important;
      -ms-interpolation-mode: bicubic !important;
      filter: none !important;
      -webkit-filter: none !important;
      object-fit: cover;
      width: 100%;
      height: auto;
      -webkit-backface-visibility: visible !important;
      backface-visibility: visible !important;
      transform: translateZ(0);
    }
    .design-image:hover {
      transform: scale(1.02) translateZ(0);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    }
    
    /* Lazy loading styles */
    .design-image[data-src] {
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      min-height: 200px;
    }
    .design-image.loaded {
      opacity: 1;
      background: transparent;
      animation: none;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    [data-bs-theme="dark"] .design-image[data-src] {
      background: linear-gradient(90deg, #1a1a1a 25%, #2a2a2a 50%, #1a1a1a 75%);
    }

      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      z-index: 10000;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.3s ease;

    .lightbox.active {
      display: flex;
    }
    
    .lightbox-content {
      max-width: 90vw;
      max-height: 90vh;
      position: relative;
    }

      max-width: 100%;
      max-height: 90vh;

      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      display: block;

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: white;
      border: none;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      font-size: 1.5rem;

      z-index: 10001;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .lightbox-close:hover {
      background: #ef4444;
      color: white;
      transform: rotate(90deg);
    }
    
    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: white;
      border: none;
      width: 60px;

    }
    
    .lightbox-prev { left: 20px; }
    .lightbox-next { right: 20px; }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }

  <!-- Automobile Gallery JavaScript -->
  <script>
    (function() {
      'use strict';
      
      // Initialize scroll progress bar
      const scrollProgressBar = document.getElementById('scrollProgressBar');
      if (scrollProgressBar) {
        window.addEventListener('scroll', function() {
          const windowHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
          const scrolled = (window.scrollY / windowHeight) * 100;
          scrollProgressBar.style.width = scrolled + '%';
          scrollProgressBar.setAttribute('aria-valuenow', Math.round(scrolled));
        });
      }
      
      // List of images to display
      // Images are in: images/automobile-designs/ folder
      const automobileImages = [
        { src: 'images/automobile-designs/car01.webp', title: 'Car Design 01', description: 'Automobile Design Concept' },
        { src: 'images/automobile-designs/car02.webp', title: 'Car Design 02', description: 'Automobile Design Concept' },
        { src: 'images/automobile-designs/car03.webp', title: 'Car Design 03', description: 'Automobile Design Concept' },
        { src: 'images/automobile-designs/car04.webp', title: 'Car Design 04', description: 'Automobile Design Concept' },
        { src: 'images/automobile-designs/car05.webp', title: 'Car Design 05', description: 'Automobile Design Concept' },
        { src: 'images/automobile-designs/car06.webp', title: 'Car Design 06', description: 'Automobile Design Concept' },
        { src: 'images/automobile-designs/car07.webp', title: 'Car Design 07', description: 'Automobile Design Concept' },
        { src: 'images/automobile-designs/car08.webp', title: 'Car Design 08', description: 'Automobile Design Concept' },
        { src: 'images/automobile-designs/car09.webp', title: 'Car Design 09', description: 'Automobile Design Concept' },
        { src: 'images/automobile-designs/car10.webp', title: 'Car Design 10', description: 'Automobile Design Concept' },
        { src: 'images/automobile-designs/car11.webp', title: 'Car Design 11', description: 'Automobile Design Concept' },
        { src: 'images/automobile-designs/car12.webp', title: 'Car Design 12', description: 'Automobile Design Concept' },
        { src: 'images/automobile-designs/car13.webp', title: 'Car Design 13', description: 'Automobile Design Concept' },
        { src: 'images/automobile-designs/car14.webp', title: 'Car Design 14', description: 'Automobile Design Concept' },
        { src: 'images/automobile-designs/car15.webp', title: 'Car Design 15', description: 'Automobile Design Concept' },
        { src: 'images/automobile-designs/car16.webp', title: 'Car Design 16', description: 'Automobile Design Concept' },
        { src: 'images/automobile-designs/car17.webp', title: 'Car Design 17', description: 'Automobile Design Concept' },
        { src: 'images/automobile-designs/car18.webp', title: 'Car Design 18', description: 'Automobile Design Concept' },
        { src: 'images/automobile-designs/car19.webp', title: 'Car Design 19', description: 'Automobile Design Concept' },
        { src: 'images/automobile-designs/car20.webp', title: 'Car Design 20', description: 'Automobile Design Concept' },
        { src: 'images/automobile-designs/car21.webp', title: 'Car Design 21', description: 'Automobile Design Concept' },
        { src: 'images/automobile-designs/car22.webp', title: 'Car Design 22', description: 'Automobile Design Concept' },
      ];
      
      // Function to create image card
      function createImageCard(imageData, index) {
        const card = document.createElement('div');
        card.className = 'masonry-item';
        card.innerHTML = `
          <div class="card h-100 border-0 shadow-sm design-card" style="cursor: pointer;">
            <div class="card-img-top overflow-hidden" style="border-radius: 12px 12px 0 0;">
              <img src="${imageData.src}" 
                   alt="${imageData.title || 'Automobile Design'}" 
                   class="img-fluid w-100 design-image" 
                   loading="lazy"
                   decoding="async"
                   data-index="${index}"
                   onerror="this.style.display='none';">
            </div>
            <div class="card-body text-center">
              <h5 class="card-title fw-bold text-dark mb-2">${imageData.title || 'Design Concept'}</h5>
              <p class="card-text text-muted mb-0">${imageData.description || ''}</p>
            </div>
          </div>
        `;
        // Add click handler to open modal
        const cardElement = card.querySelector('.design-card');
        if (cardElement) {
          cardElement.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            console.log('Card clicked, opening lightbox for index:', index);
            if (typeof openLightbox === 'function') {
              openLightbox(index);
            } else {
              console.error('openLightbox function not found');
            }
          });
        }
        return card;
      }
      
      // Lightbox functions - define BEFORE loadImages so they're available
      let currentImageIndex = 0;
      
      function openLightbox(index) {
        console.log('openLightbox called with index:', index);
        if (!window.automobileImages || index < 0 || index >= window.automobileImages.length) {
          console.error('Invalid index or images not loaded:', { index, imagesLength: window.automobileImages?.length });
          return;
        }
        
        currentImageIndex = index;
        const imageData = window.automobileImages[index];
        console.log('Opening lightbox with image:', imageData);
        
        const lightbox = document.getElementById('automobile-lightbox');
        const lightboxContent = lightbox ? lightbox.querySelector('.lightbox-content') : null;
        const lightboxImg = document.getElementById('automobile-lightbox-img');
        const lightboxTitle = document.getElementById('automobile-lightbox-title');
        const lightboxDesc = document.getElementById('automobile-lightbox-desc');
        
        console.log('Lightbox elements:', { lightbox: !!lightbox, lightboxContent: !!lightboxContent, lightboxImg: !!lightboxImg });
        
        if (!lightbox) {
          console.error('Lightbox element not found');
          alert('Lightbox element not found. Please refresh the page.');
          return;
        }
        if (!lightboxImg) {
          console.error('Lightbox image element not found');
          alert('Lightbox image element not found. Please refresh the page.');
          return;
        }
        
        // Set title and description first
        if (lightboxTitle) lightboxTitle.textContent = imageData.title || 'Design Concept';
        if (lightboxDesc) lightboxDesc.textContent = imageData.description || '';
        
        // Show lightbox immediately
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
        
        // Load image
        lightboxImg.alt = imageData.title || 'Automobile Design';
        lightboxImg.style.display = 'block';
        lightboxImg.src = imageData.src;
        
        // Handle image load/error
        lightboxImg.onload = function() {
          console.log('Image loaded successfully:', imageData.src);
          lightboxImg.style.display = 'block';
        };
        
        lightboxImg.onerror = function() {
          console.error('Failed to load image:', imageData.src);
          lightboxImg.style.display = 'none';
          if (lightboxContent) {
            let errorMsg = lightboxContent.querySelector('.lightbox-error');
            if (!errorMsg) {
              errorMsg = document.createElement('div');
              errorMsg.className = 'lightbox-error';
              errorMsg.style.cssText = 'color: white; text-align: center; padding: 2rem;';
              lightboxContent.appendChild(errorMsg);
            }
            errorMsg.textContent = 'Failed to load image: ' + (imageData.title || 'Unknown');
          }
        };
        
        console.log('Lightbox opened successfully');
      }
      
      function closeLightbox() {
        const lightbox = document.getElementById('automobile-lightbox');
        if (lightbox) {
          lightbox.classList.remove('active');
          document.body.style.overflow = '';
        }
      }
      
      function nextImage() {
        if (!window.automobileImages) return;
        const nextIndex = (currentImageIndex + 1) % window.automobileImages.length;
        openLightbox(nextIndex);
      }
      
      function prevImage() {
        if (!window.automobileImages) return;
        const prevIndex = (currentImageIndex - 1 + window.automobileImages.length) % window.automobileImages.length;
        openLightbox(prevIndex);
      }
      
      // Function to load images
      async function loadImages() {
        const gallery = document.getElementById('design-gallery');
        if (!gallery) return;
        
        let imagesToDisplay = [...automobileImages];
        
        if (imagesToDisplay.length === 0) {
          // Show placeholder if no images found
          gallery.innerHTML = `
            <div class="masonry-item">
              <div class="card h-100 border-0 shadow-sm design-card">
                <div class="card-img-top overflow-hidden bg-light d-flex align-items-center justify-content-center" style="border-radius: 12px 12px 0 0; min-height: 300px;">
                  <div class="text-center p-4">
                    <i class="bx bx-car text-muted" style="font-size: 4rem;"></i>
                    <p class="text-muted mt-3 mb-0">Add your automobile design images</p>
                    <small class="text-muted">Place images in: <code>images/automobile-designs/</code></small>
                  </div>
                </div>
                <div class="card-body text-center">
                  <h5 class="card-title fw-bold text-dark mb-2">Ready for Your Designs</h5>
                  <p class="card-text text-muted mb-0">Add images to showcase your automobile designs</p>
                </div>
              </div>
            </div>
          `;
          return;
        }
        
        // Store images array globally for modal navigation
        window.automobileImages = imagesToDisplay;
        
        // Create cards for each image
        imagesToDisplay.forEach((imageData, index) => {
          const card = createImageCard(imageData, index);
          gallery.appendChild(card);
        });
        
        // Initialize lazy loading for images
        const lazyImages = gallery.querySelectorAll('.design-image');
        
        if ('IntersectionObserver' in window) {
          const imageObserver = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
              if (entry.isIntersecting) {
                const img = entry.target;
                if (img.dataset.src) {
                  img.src = img.dataset.src;
                  img.removeAttribute('data-src');
                }
                img.classList.add('loaded');
                observer.unobserve(img);
              }
            });
          }, {
            rootMargin: '100px 0px',
            threshold: 0.01
          });
          
          lazyImages.forEach(img => imageObserver.observe(img));
        }
      }
      
      // Expose functions globally
      window.openAutomobileLightbox = openLightbox;
      window.closeAutomobileLightbox = closeLightbox;
      window.nextAutomobileImage = nextImage;
      window.prevAutomobileImage = prevImage;
      
      // Keyboard navigation
      document.addEventListener('keydown', (e) => {
        const lightbox = document.getElementById('automobile-lightbox');
        if (!lightbox || !lightbox.classList.contains('active')) return;
        
        if (e.key === 'Escape') {
          closeLightbox();
        } else if (e.key === 'ArrowRight') {
          nextImage();
        } else if (e.key === 'ArrowLeft') {
          prevImage();
        }
      });
      
      // Close on background click
      document.addEventListener('click', (e) => {
        const lightbox = document.getElementById('automobile-lightbox');
        if (lightbox && lightbox.classList.contains('active')) {
          const lightboxContent = lightbox.querySelector('.lightbox-content');
          if (lightboxContent && !lightboxContent.contains(e.target)) {
            closeLightbox();
          }
        }
      });
      
      // Load images when DOM is ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadImages);
      } else {
        loadImages();
      }
    })();
  </script>
  
  <!-- Hamburger Menu Handler -->
  <script>
    (function() {
      'use strict';
      
      function initHamburgerMenu() {
        const toggle = document.getElementById('editorialNavToggle');
        if (!toggle) {
          setTimeout(initHamburgerMenu, 100);
          return;
        }
        
        let overlay = document.getElementById('editorialNavOverlay');
        if (!overlay) {
          overlay = document.querySelector('.editorial-nav-overlay');
        }
        
        if (!overlay) {
          setTimeout(initHamburgerMenu, 100);
          return;
        }
        
        // Prevent multiple initializations
        if (toggle.hasAttribute('data-menu-initialized')) {
          return;
        }
        toggle.setAttribute('data-menu-initialized', 'true');
        
        // Ensure overlay has ID and is in body
        if (!overlay.id) overlay.id = 'editorialNavOverlay';
        if (overlay.parentElement !== document.body) {
          document.body.appendChild(overlay);
        }
        
        let isOpen = false;
        
        function toggleMenu(e) {
          if (e) {
            e.preventDefault();
            e.stopPropagation();
          }
          
          isOpen = !isOpen;
          
          if (isOpen) {
            overlay.classList.add('active');
            overlay.setAttribute('aria-hidden', 'false');
            toggle.classList.add('active');
            toggle.setAttribute('aria-expanded', 'true');
            document.body.style.overflow = 'hidden';
            document.documentElement.style.overflow = 'hidden';
          } else {
            overlay.classList.remove('active');
            overlay.setAttribute('aria-hidden', 'true');
            toggle.classList.remove('active');
            toggle.setAttribute('aria-expanded', 'false');
            document.body.style.overflow = '';
            document.documentElement.style.overflow = '';
          }
        }
        
        // Clone button to remove old listeners
        const newToggle = toggle.cloneNode(true);
        toggle.parentNode.replaceChild(newToggle, toggle);
        
        // Ensure styles
        newToggle.style.pointerEvents = 'auto';
        newToggle.style.cursor = 'pointer';
        newToggle.style.zIndex = '10001';
        newToggle.style.position = 'relative';
        
        // Add event listeners
        newToggle.addEventListener('click', toggleMenu, true);
        newToggle.addEventListener('click', toggleMenu, false);
        newToggle.onclick = toggleMenu;
        
        // Close on overlay background click
        overlay.addEventListener('click', function(e) {
          if (e.target === overlay) {
            toggleMenu(e);
          }
        });
        
        // Close on Escape key
        document.addEventListener('keydown', function(e) {
          if (e.key === 'Escape' && isOpen) {
            toggleMenu(e);
          }
        });
        
        // Close button handler
        const closeBtn = overlay.querySelector('[id*="close"], .nav-close, .close-btn');
        if (closeBtn) {
          closeBtn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            toggleMenu(e);
          });
        }
      }
      
      // Initialize immediately and retry
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initHamburgerMenu);
      } else {
        initHamburgerMenu();
      }
      
      setTimeout(initHamburgerMenu, 500);
      setTimeout(initHamburgerMenu, 1000);
      setTimeout(initHamburgerMenu, 2000);
      
      // Watch for navbar loading
      const observer = new MutationObserver(function() {
        initHamburgerMenu();
      });
      
      const navbarSection = document.getElementById('navbar-section');
      if (navbarSection) {
        observer.observe(navbarSection, {
          childList: true,
          subtree: true
        });
      }
    })();
  </script>
  
  <!-- Enhanced Features JavaScript -->
  <script>
    (function() {
      'use strict';
      
      // Mark body as JS-enabled immediately
      document.documentElement.classList.add('js-enabled');
    
      // ============================================
      // KEYBOARD SHORTCUTS OVERLAY
      // ============================================
      function setupKeyboardShortcuts() {
        document.addEventListener('keydown', (e) => {
          // Don't trigger if typing in input
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
            if (e.key === 'Escape' && e.target.id === 'navbarSearchInput') {
              const searchInput = document.getElementById('navbarSearchInput');
              if (searchInput && searchInput.value) {
                searchInput.value = '';
                const clearBtn = document.getElementById('navbarSearchClear');
                if (clearBtn) clearBtn.click();
              }
            }
            return;
          }
          
          // Escape - Close shortcuts overlay or search overlay
          if (e.key === 'Escape') {
            const shortcutsOverlay = document.getElementById('keyboardShortcutsOverlay');
            if (shortcutsOverlay && shortcutsOverlay.classList.contains('active')) {
              shortcutsOverlay.classList.remove('active');
              shortcutsOverlay.setAttribute('aria-hidden', 'true');
              document.body.style.overflow = '';
              return;
            }
            
            const searchOverlay = document.getElementById('navbarSearchOverlay');
            if (searchOverlay && searchOverlay.classList.contains('active')) {
              const closeBtn = document.getElementById('navbarSearchClose');
              if (closeBtn) closeBtn.click();
              return;
            }
          }
          
          // ? - Show shortcuts help
          if (e.key === '?' && !e.shiftKey) {
            e.preventDefault();
            showKeyboardShortcutsHelp();
          }
          
          // D - Toggle dark mode
          if ((e.key === 'd' || e.key === 'D') && !e.ctrlKey && !e.metaKey && !e.altKey) {
            const themeToggle = document.getElementById('themeToggle');
            if (themeToggle) {
              e.preventDefault();
              themeToggle.click();
            }
          }
        });
      }
      
      function showKeyboardShortcutsHelp() {
        const overlay = document.getElementById('keyboardShortcutsOverlay');
        if (!overlay) return;
        
        overlay.classList.add('active');
        overlay.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        
        // Focus close button
        const closeBtn = document.getElementById('keyboardShortcutsClose');
        if (closeBtn) {
          setTimeout(() => closeBtn.focus(), 100);
        }
        
        // Close handlers
        const closeOverlay = () => {
          overlay.classList.remove('active');
          overlay.setAttribute('aria-hidden', 'true');
          document.body.style.overflow = '';
        };
        
        // Close button
        if (closeBtn) {
          closeBtn.onclick = closeOverlay;
        }
        
        // Close on backdrop click
        overlay.onclick = (e) => {
          if (e.target === overlay) {
            closeOverlay();
          }
        };
      }
      
      // ============================================
      // ENHANCED SCREEN READER ANNOUNCEMENTS
      // ============================================
      function announceToScreenReader(message, priority = 'polite') {
        let liveRegion;
        
        // Choose appropriate live region based on priority
        if (priority === 'assertive') {
          liveRegion = document.getElementById('aria-live-region-assertive');
        } else if (priority === 'status') {
          liveRegion = document.getElementById('aria-live-region-status');
        } else {
          liveRegion = document.getElementById('aria-live-region');
        }
        
        if (liveRegion) {
          // Clear previous message
          liveRegion.textContent = '';
          
          // Small delay to ensure screen reader picks up the change
          setTimeout(() => {
            liveRegion.textContent = message;
            
            // Clear after announcement (longer for assertive)
            const clearDelay = priority === 'assertive' ? 2000 : 1000;
            setTimeout(() => {
              liveRegion.textContent = '';
            }, clearDelay);
          }, 100);
        }
      }
      
      // Initialize functions
      setupKeyboardShortcuts();
      
      // Export functions globally
      window.announceToScreenReader = announceToScreenReader;
    })();
  </script>
